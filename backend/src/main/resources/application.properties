# Application Name
spring.application.name=Floro Puja Flowers API

# Server Configuration
server.port=8080
server.servlet.context-path=/api

# Database Configuration (Local PostgreSQL)
# Using local database due to network connectivity issues with Supabase
spring.datasource.url=jdbc:postgresql://localhost:5432/floro_db
spring.datasource.username=postgres
spring.datasource.password=postgres123
spring.datasource.driver-class-name=org.postgresql.Driver

# Note: To switch back to Supabase when network issues are resolved, use:
# spring.datasource.url=jdbc:postgresql://db.xulzddxaldzhabymaupe.supabase.co:5432/postgres
# spring.datasource.password=Yqlf3SxaWIqpJ4NA

# JPA Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true

# SQL Initialization - Enable data.sql execution
spring.sql.init.mode=always
spring.jpa.defer-datasource-initialization=true

# JWT Configuration
jwt.secret=FloroSecretKeyForJWTTokenGenerationMustBeLongEnough2024
jwt.expiration=86400000

# CORS Configuration
cors.allowed-origins=http://localhost:3000,http://localhost:3001

# Logging
logging.level.com.floro=DEBUG
logging.level.org.springframework.security=DEBUG
logging.level.org.hibernate.SQL=DEBUG

# File Upload Configuration
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB


